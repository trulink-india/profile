<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOTO24</title>
    <meta name="theme-color" content="#111111" />
    <meta name="application-name" content="MOTO24" />
    <meta name="apple-mobile-web-app-title" content="MOTO24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon (same MOTO24 logo artwork) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- iOS / mobile home-screen icon (same logo) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <main style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem;">
      <h1>MOTO24</h1>
      <p>
        Favicon and mobile app icons are wired from the MOTO24 logo
        (<code>moto24-logo.jpg</code> → favicon + apple-touch + Android/PWA icons).
      </p>
      <p>Icon previews:</p>
      <p>
        <img src="/favicon-32x32.png" width="32" height="32" alt="Favicon 32" />
        <img src="/apple-touch-icon.png" width="64" height="64" alt="Apple touch icon" />
        <img src="/android-chrome-192x192.png" width="96" height="96" alt="Android Chrome 192" />
      </p>
    </main>
  </body>
</html>
